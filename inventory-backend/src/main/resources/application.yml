spring:
  application:
    name: inventory-backend
  datasource:
    url: jdbc:mysql://localhost:3306/inventory
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true


server:
  port: 8081